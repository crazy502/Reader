<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Notebook</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="webview.css" />
    <link rel="stylesheet" href="reader-engine.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell" data-app-mode="work">
      <section class="work-mode" id="workMode" data-i18n-aria="workModeAria">
        <header class="work-header">
          <p class="eyebrow">NOTEBOOK</p>
          <h1 data-i18n="workNoteTitle"></h1>
        </header>
        <textarea id="workNote" data-i18n-aria="workNoteTitle" spellcheck="false"></textarea>
        <footer class="work-footer">
          <span id="noteStatus" data-i18n="noteReady"></span>
          <button id="enableHover" type="button" data-i18n="enableHover"></button>
        </footer>
      </section>

      <section class="page bookshelf-page" id="bookshelfPage" data-i18n-aria="bookshelfTitle">
        <header class="shelf-header">
          <div>
            <p class="eyebrow">NOTEBOOK</p>
            <h1 data-i18n="bookshelfTitle"></h1>
          </div>
          <button class="quiet-action" id="addBookButton" type="button">
            <span aria-hidden="true">＋</span>
            <span data-i18n="addBook"></span>
          </button>
        </header>

        <main class="shelf-scroll" id="shelfScroll">
          <div class="book-grid" id="bookGrid"></div>
          <div class="empty-state" id="emptyState" hidden>
            <div class="empty-book" aria-hidden="true"></div>
            <h2 data-i18n="emptyShelfTitle"></h2>
            <p data-i18n="emptyShelfMessage"></p>
            <button class="primary-action" id="emptyAddButton" type="button" data-i18n="addFirstBook"></button>
          </div>
        </main>
      </section>

      <section class="page book-page is-active" id="bookPage" data-i18n-aria="readingPageAria">
        <header class="reader-nav">
          <button class="icon-button" id="backToShelf" type="button" data-i18n-aria="returnToShelf">
            <span class="back-icon" aria-hidden="true">←</span>
          </button>
          <button class="chapter-trigger" id="chapterTrigger" type="button" aria-haspopup="dialog">
            <span id="navChapterTitle" data-i18n="noChapter"></span>
            <span class="chevron" aria-hidden="true">⌄</span>
          </button>
          <button class="icon-button" id="readerMenuButton" type="button" data-i18n-aria="readerMenu" aria-haspopup="menu">
            <span class="more-icon" aria-hidden="true">⋯</span>
          </button>
        </header>

        <main class="reading-scroll" id="readingScroll" tabindex="0">
          <article class="reading-column" id="readingArticle"></article>
        </main>

        <footer class="reader-progress" data-i18n-aria="readingProgress">
          <div class="reader-progress-track"><span id="readerProgressFill"></span></div>
          <span id="readerProgressText">63%</span>
        </footer>

        <div class="reader-loading" id="readerLoading" hidden>
          <div class="reader-loading-card" role="status" aria-live="polite">
            <span class="reader-loading-mark" aria-hidden="true"></span>
            <strong id="loadingTitle" data-i18n="loadingBookTitle"></strong>
            <span id="loadingDetail" data-i18n="loadingBookDetail"></span>
            <button id="cancelLoading" type="button" data-i18n="returnToShelf"></button>
          </div>
        </div>

        <div class="popover reader-menu" id="readerMenu" role="menu" hidden>
          <button class="menu-row" id="mockOpenFile" type="button" role="menuitem">
            <span class="menu-row-icon" aria-hidden="true">＋</span>
            <span data-i18n="openFile"></span>
          </button>
          <div class="menu-section">
            <p class="menu-label" data-i18n="readingTheme"></p>
            <div class="theme-grid" id="themeGrid" data-i18n-aria="readingTheme"></div>
          </div>
          <div class="menu-divider"></div>
          <div class="menu-section settings-section">
            <div class="setting-heading">
              <p class="menu-label" data-i18n="readingSettings"></p>
              <button class="text-button" id="resetSettings" type="button" data-i18n="resetDefault"></button>
            </div>
            <label class="range-setting">
              <span data-i18n="fontSize"></span>
              <output id="fontSizeValue">18</output>
              <input id="fontSizeRange" type="range" min="15" max="23" value="18" step="1" />
            </label>
            <label class="range-setting">
              <span data-i18n="lineHeight"></span>
              <output id="lineHeightValue">1.95</output>
              <input id="lineHeightRange" type="range" min="1.65" max="2.25" value="1.95" step="0.05" />
            </label>
          </div>
        </div>
      </section>

      <div class="scrim" id="chapterScrim" hidden></div>
      <aside class="chapter-panel" id="chapterPanel" role="dialog" aria-modal="true" aria-labelledby="chapterPanelTitle" hidden>
        <header class="panel-header">
          <div>
            <p class="eyebrow">CONTENTS</p>
            <h2 id="chapterPanelTitle" data-i18n="contents"></h2>
          </div>
          <button class="icon-button small" id="closeChapters" type="button" data-i18n-aria="closeContents">×</button>
        </header>
        <div class="chapter-list" id="chapterList"></div>
      </aside>

      <div class="context-menu" id="bookContextMenu" role="menu" hidden>
        <button type="button" data-action="rename" data-i18n="renameTitle"></button>
        <button type="button" data-action="relocate" data-i18n="relocate"></button>
        <div class="menu-divider"></div>
        <button type="button" class="danger-text" data-action="remove" data-i18n="removeTitle"></button>
      </div>

      <div class="modal-backdrop" id="modalBackdrop" hidden>
        <section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
          <h2 id="dialogTitle" data-i18n="renameTitle"></h2>
          <p id="dialogMessage"></p>
          <label class="dialog-input-wrap" id="dialogInputWrap">
            <span data-i18n="displayTitle"></span>
            <input id="dialogInput" type="text" maxlength="42" />
          </label>
          <div class="dialog-actions">
            <button class="secondary-action" id="dialogCancel" type="button" data-i18n="cancel"></button>
            <button class="primary-action" id="dialogConfirm" type="button" data-i18n="confirm"></button>
          </div>
        </section>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="i18n/messages.js"></script>
    <script src="app.js"></script>
    <script src="char-position.js"></script>
    <script src="reader-engine.js"></script>
    <script src="bridge.js"></script>
  </body>
</html>
